name: Deploy to Production

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to deploy (e.g., v1.0.0)'
        required: true
        type: string

jobs:
  validate-deployment:
    name: Validate Production Deployment
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.version }}

      - name: Verify version tag exists
        run: |
          if ! git rev-parse ${{ github.event.inputs.version }} >/dev/null 2>&1; then
            echo "Error: Version tag ${{ github.event.inputs.version }} does not exist"
            exit 1
          fi

      - name: Check staging deployment
        run: |
          # Verify staging is healthy before production deployment
          response=$(curl -s -o /dev/null -w "%{http_code}" https://staging.cloudshift.example.com/health)
          if [ $response -ne 200 ]; then
            echo "Staging environment is not healthy. Cannot proceed with production deployment."
            exit 1
          fi

  deploy-production:
    name: Deploy to Production Environment
    runs-on: ubuntu-latest
    needs: validate-deployment
    environment:
      name: production
      url: https://cloudshift.example.com

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.version }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/cloudshift-backend:production
            ${{ secrets.DOCKER_USERNAME }}/cloudshift-backend:${{ github.event.inputs.version }}
            ${{ secrets.DOCKER_USERNAME }}/cloudshift-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/cloudshift-frontend:production
            ${{ secrets.DOCKER_USERNAME }}/cloudshift-frontend:${{ github.event.inputs.version }}
            ${{ secrets.DOCKER_USERNAME }}/cloudshift-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create database backup
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USERNAME }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          script: |
            cd /opt/cloudshift

            # Create backup directory if it doesn't exist
            mkdir -p /backups

            # Backup database
            timestamp=$(date +%Y%m%d_%H%M%S)
            docker-compose exec -T postgres pg_dump -U cloudshift cloudshift > /backups/pre_deploy_${timestamp}.sql

            # Keep only last 10 backups
            ls -t /backups/pre_deploy_*.sql | tail -n +11 | xargs -r rm

      - name: Deploy to production server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USERNAME }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          script: |
            cd /opt/cloudshift

            # Pull latest images
            docker pull ${{ secrets.DOCKER_USERNAME }}/cloudshift-backend:${{ github.event.inputs.version }}
            docker pull ${{ secrets.DOCKER_USERNAME }}/cloudshift-frontend:${{ github.event.inputs.version }}

            # Update image tags in environment
            export BACKEND_IMAGE=${{ secrets.DOCKER_USERNAME }}/cloudshift-backend:${{ github.event.inputs.version }}
            export FRONTEND_IMAGE=${{ secrets.DOCKER_USERNAME }}/cloudshift-frontend:${{ github.event.inputs.version }}

            # Rolling update - zero downtime deployment
            # Scale up new backend
            docker-compose -f docker-compose.yml -f docker-compose.prod.yml up -d --no-deps --scale backend=2 backend

            # Run database migrations
            docker-compose exec -T backend alembic upgrade head

            # Wait for new backend to be healthy
            sleep 15
            curl -f http://localhost:8000/health || exit 1

            # Scale down old backend
            docker-compose -f docker-compose.yml -f docker-compose.prod.yml up -d --no-deps --scale backend=1 backend

            # Update frontend
            docker-compose -f docker-compose.yml -f docker-compose.prod.yml up -d --no-deps frontend

            # Update workers
            docker-compose -f docker-compose.yml -f docker-compose.prod.yml up -d --no-deps celery-worker celery-beat

            # Final health check
            sleep 10
            curl -f http://localhost:8000/health || exit 1

      - name: Create deployment tag
        run: |
          git tag -a "deployed-production-$(date +%Y%m%d-%H%M%S)" -m "Production deployment of ${{ github.event.inputs.version }}"
          git push origin --tags

      - name: Notify deployment success
        if: success()
        uses: 8398a7/action-slack@v3
        with:
          status: custom
          custom_payload: |
            {
              text: "🚀 CloudShift PRODUCTION deployment successful",
              attachments: [{
                color: 'good',
                text: `Version: ${{ github.event.inputs.version }}\nDeployed by: ${process.env.GITHUB_ACTOR}`
              }]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Notify deployment failure
        if: failure()
        uses: 8398a7/action-slack@v3
        with:
          status: custom
          custom_payload: |
            {
              text: "🔥 CloudShift PRODUCTION deployment FAILED",
              attachments: [{
                color: 'danger',
                text: `Version: ${{ github.event.inputs.version }}\nDeployed by: ${process.env.GITHUB_ACTOR}\n⚠️ IMMEDIATE ACTION REQUIRED`
              }]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  # Production smoke tests
  production-smoke-tests:
    name: Production Smoke Tests
    runs-on: ubuntu-latest
    needs: deploy-production
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run production smoke tests
        env:
          PRODUCTION_URL: https://cloudshift.example.com
        run: |
          # Health check
          response=$(curl -s -o /dev/null -w "%{http_code}" $PRODUCTION_URL/health)
          if [ $response -ne 200 ]; then
            echo "Health check failed with status $response"
            exit 1
          fi

          # Frontend accessible
          response=$(curl -s -o /dev/null -w "%{http_code}" $PRODUCTION_URL)
          if [ $response -ne 200 ]; then
            echo "Frontend check failed with status $response"
            exit 1
          fi

          # API docs accessible (if public)
          response=$(curl -s -o /dev/null -w "%{http_code}" $PRODUCTION_URL/docs)
          if [ $response -ne 200 ] && [ $response -ne 401 ]; then
            echo "API docs check failed with status $response"
            exit 1
          fi

          echo "✅ All production smoke tests passed"

      - name: Create GitHub release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.event.inputs.version }}
          release_name: Release ${{ github.event.inputs.version }}
          body: |
            Production deployment of CloudShift ${{ github.event.inputs.version }}

            Deployed at: $(date -u +"%Y-%m-%d %H:%M:%S UTC")
            Deployed by: ${{ github.actor }}

            🚀 Successfully deployed to production
          draft: false
          prerelease: false
