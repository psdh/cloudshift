version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: cloudshift-postgres
    environment:
      POSTGRES_USER: cloudshift
      POSTGRES_PASSWORD: cloudshift_dev_password
      POSTGRES_DB: cloudshift
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloudshift"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: cloudshift-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
